server:
  port: 8181

meg:
  pull:
    client:
      base-url: http://localhost:8080

sample:
  routing:
    amount-max-standard-to-pay: 10000
    amount-max-large-to-pay: 100000
  topics:
    in:
      reintegros:
        id: solicitudes-reintegros
        version: 1
        subscription:
          name-sub: pago-reintegros
          # Reemplazar con el token devuelto al crear la suscripcion (POST /subscriptions)
          token: 11d4a236-1403-4b2d-8e88-cc293e42f9a4
          rows: 10
          cron: "*/10 * * * * *"
      reintegros-alto-monto:
        id: solicitudes-reintegros-alto-monto
        version: 1
        subscription:
          name-sub: pago-reintegros-alto-monto
          # Reemplazar con el token devuelto al crear la suscripcion (POST /subscriptions)
          token: e20d5112-096d-4701-bcc2-579ed9554c4f
          rows: 10
          cron: "*/12 * * * * *"
      pagos-reintegros:
        id: pagos-reintegros
        version: 1
        subscription:
          name-sub: notificacion-pago-reintegros
          # Reemplazar con el token devuelto al crear la suscripcion (POST /subscriptions)
          token: 928f2210-b664-407e-81b0-b15f585c8a87
          rows: 10
          cron: "*/15 * * * * *"
    out:
      pagos-reintegros:
        id: pagos-reintegros
        version: 1
        # Reemplazar con el publishToken devuelto al crear el topic (POST /topics)
        token: 881a85f2-a36e-416a-a624-b842c87c7451
      reintegros-alto-monto:
        id: solicitudes-reintegros-alto-monto
        version: 1
        # Reemplazar con el publishToken devuelto al crear el topic (POST /topics)
        token: 9530ab99-413f-425b-b592-c65050f63d9d
